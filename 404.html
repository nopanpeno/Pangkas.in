<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9ed">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Shortlink tidak ditemukan — Pangkas.in</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background-color: #fff9ed;
      background-image: radial-gradient(#171717 1px,transparent 1.4px);
      background-size: 24px 24px;
      color: #171717;
      font-family: "DM Sans",system-ui,sans-serif;
    }

    .panel {
      width: min(100%,470px);
      padding: clamp(24px,7vw,42px);
      border: 3px solid #171717;
      border-radius: 5px;
      background: #fffefa;
      box-shadow: 8px 8px 0 #171717;
      text-align: center;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border: 2.5px solid #171717;
      border-radius: 5px;
      background: #f7ff64;
      box-shadow: 4px 4px 0 #171717;
      transform: rotate(-4deg);
    }

    .mark svg {
      width: 37px;
      height: 37px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 9px;
      border: 2px solid #171717;
      background: #ff9dc7;
      font: 700 11px "Space Grotesk",system-ui,sans-serif;
      letter-spacing: 1px;
    }

    .code {
      overflow-wrap: anywhere;
      margin: 18px 0 0;
      font: 700 clamp(38px,12vw,62px)/1.05 "Space Grotesk",system-ui,sans-serif;
      letter-spacing: -.07em;
    }

    .message {
      margin: 13px auto 23px;
      color: #4e4a44;
      font-size: 14px;
      line-height: 1.7;
    }

    .home {
      display: inline-block;
      padding: 12px 16px;
      border: 2px solid #171717;
      border-radius: 3px;
      background: #a8c4ff;
      box-shadow: 4px 4px 0 #171717;
      color: #171717;
      font: 700 12px "Space Grotesk",system-ui,sans-serif;
      text-decoration: none;
      transition: transform .12s,box-shadow .12s;
    }

    .home:hover {
      transform: translate(3px,3px);
      box-shadow: 1px 1px 0 #171717;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 256 256" aria-hidden="true" focusable="false"><path fill="#171717" fill-rule="evenodd" d="M59,28 H139 A58,58 0 0 1 139,144 H103 V168 L59,192 Z M103,72 H139 A14,14 0 0 1 139,100 H103 Z M59,212 L103,188 V228 H59 Z"/></svg></div>
    <div class="eyebrow">PANGKAS.IN / SHORTLINK</div>
    <h1 class="code" id="code">…</h1>
    <p class="message" id="message">Sedang mencari tujuan link kamu…</p>
    <a class="home" id="home" href="./">↖ Kembali ke beranda</a>
  </main>
  <script>
    (async function () {
      const path = decodeURIComponent(window.location.pathname).replace(/\/$/, "");
      const alias = path.split("/").pop();
      const home = new URL("./", window.location.href);
      document.querySelector("#home").href = home.href;
      document.querySelector("#code").textContent = "/" + alias;
      if (!alias || alias.toLowerCase() === "404.html") {
        document.querySelector("#message").textContent = "Halaman ini tidak tersedia.";
        return;
      }
      try {
        const response = await fetch(new URL("links.json", home));
        if (!response.ok) throw new Error("config");
        const links = await response.json();
        const key = Object.keys(links).find((item) => item.toLowerCase() === alias.toLowerCase());
        const target = key && links[key];
        if (target) {
          const destination = new URL(target);
          if (["http:", "https:"].includes(destination.protocol)) {
            document.querySelector("#message").textContent = "Link ditemukan. Kamu akan segera dialihkan.";
            window.location.replace(destination.href);
            return;
          }
        }
        document.querySelector("#message").textContent = "Shortlink tidak ditemukan. Mungkin alias-nya salah atau belum terdaftar.";
      } catch {
        document.querySelector("#message").textContent = "Daftar shortlink tidak dapat dimuat saat ini.";
      }
    })();
  </script>
</body>
</html>
