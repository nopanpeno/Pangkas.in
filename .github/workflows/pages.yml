name: Deploy Pangkas.in to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate links.json
        run: node scripts/links.mjs check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: node scripts/links.mjs build _site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
